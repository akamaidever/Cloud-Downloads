# OctoFetch-YouTubeRelease-Version: 19

name: 'YouTube to GitHub Release Engine'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL'
        required: true
        type: string
      folder_name:
        description: 'Folder identifier used for the links manifest path'
        required: true
        type: string
      release_tag:
        description: 'Tag name for the GitHub release (created if absent)'
        required: true
        type: string
      release_title:
        description: 'Release title shown on GitHub (defaults to the tag)'
        required: false
        type: string
        default: ''
      output_format:
        description: 'mp4 or mp3'
        required: false
        type: string
        default: 'mp4'
      desired_quality:
        description: 'Video quality (720p, 1080p) or audio bitrate (128kbps, 192kbps, 320kbps)'
        required: false
        type: string
        default: '720p'
      chunk_threshold_bytes:
        description: 'Files larger than this are split into N parts before upload'
        required: false
        type: string
        default: '2040109465'  # ~1.95 GiB
      cookies:
        description: 'Optional YouTube cookies in Netscape format, base64-encoded. Only needed for age-restricted, members-only or region-locked videos.'
        required: false
        type: string
        default: ''
      max_mb:
        description: 'Refuse videos larger than this many MB. 0 means no limit.'
        required: false
        type: string
        default: '0'

permissions:
  contents: write

concurrency:
  group: yt-release-${{ github.event.inputs.release_tag }}-${{ github.event.inputs.folder_name }}
  cancel-in-progress: false

jobs:
  youtube-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:

      - name: Checkout (sparse, fast)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            .octofetch
          sparse-checkout-cone-mode: false

      - name: Start PO-Token Provider (Docker)
        run: |
          docker run --name bgutil-provider -d --restart always -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
          for i in {1..30}; do
            if curl -s http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              echo "PO-Token Provider is ready."
              break
            fi
            echo "Waiting for PO-Token Provider..."
            sleep 1
          done

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zip curl python3 python3-pip ffmpeg
          pip3 install --quiet -U "yt-dlp[default]" yt-dlp-ejs bgutil-ytdlp-pot-provider

      - name: Install Deno Runtime
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Verify YouTube tools
        run: |
          set -e
          export PATH="$HOME/.deno/bin:$PATH"
          ffmpeg -version | head -n 1
          deno --version || true
          python3 -m yt_dlp --version
          python3 -c "import yt_dlp; print('yt_dlp import ok')"
          curl -s http://127.0.0.1:4416/ping || echo "Warning: POT provider ping failed"

      - name: Download video
        env:
          INPUT_URL: ${{ github.event.inputs.video_url }}
          INPUT_FORMAT: ${{ github.event.inputs.output_format }}
          INPUT_QUALITY: ${{ github.event.inputs.desired_quality }}
          INPUT_COOKIES: ${{ github.event.inputs.cookies }}
          INPUT_MAX_MB: ${{ github.event.inputs.max_mb }}
        run: |
          python3 << 'EOF'
          """Downloads a YouTube video using pure yt-dlp with PO-Token Provider.

          Writes .download_info with:
              line 1: the absolute path of the downloaded file
              line 2: the file name
              line 3: the title
          """

          import base64
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import time

          URL = os.environ.get("INPUT_URL", "").strip()
          FMT = os.environ.get("INPUT_FORMAT", "mp4").strip().lower()
          QUALITY = os.environ.get("INPUT_QUALITY", "720p").strip().lower()
          COOKIES_B64 = os.environ.get("INPUT_COOKIES", "").strip()
          CHUNK_LIMIT_MB = int(os.environ.get("INPUT_MAX_MB", "0") or 0)

          cookies_file = None
          clean_cookie_file = None
          stripped_cookie_file = None

          def die(message, detail=""):
              for cf in (cookies_file, clean_cookie_file, stripped_cookie_file):
                  if cf and os.path.exists(cf):
                      try:
                          os.remove(cf)
                      except OSError:
                          pass
              print("Cleaned up temporary cookie files.")
              if detail:
                  print(f"::error::{message}")
                  print(detail)
              else:
                  print(f"::error::{message}")
              sys.exit(1)

          def quality_height(raw):
              m = re.search(r"(\d{3,4})", raw or "")
              if not m:
                  return 720
              value = int(m.group(1))
              for floor in (2160, 1440, 1080, 720, 480, 360, 240, 144):
                  if value >= floor:
                      return floor
              return 144

          def sanitize_cookie_file(src_path, dst_path, strip_rolling=False):
              if not src_path or not os.path.exists(src_path):
                  return False
              with open(src_path, "r", encoding="utf-8", errors="replace") as fh:
                  lines = fh.readlines()
              out_lines = [
                  "# Netscape HTTP Cookie File\n",
                  "# https://curl.haxx.se/rfc/cookie_spec.html\n",
                  "# This is a generated file! Do not edit.\n\n"
              ]
              kept = 0
              for line in lines:
                  s = line.strip()
                  if not s or s.startswith("# Netscape") or s.startswith("# http") or s.startswith("# This is"):
                      continue
                  if s.startswith("#") and not s.startswith("#HttpOnly_"):
                      continue
                  parts = s.split("\t")
                  if len(parts) < 7:
                      parts = re.split(r"\s+", s)
                  if len(parts) >= 7:
                      cname = parts[5].strip()
                      # If strip_rolling is True, eliminate volatile session tokens (*PSIDTS, *SIDCC)
                      if strip_rolling and any(k in cname for k in ("PSIDTS", "SIDCC")):
                          continue
                      cleaned_row = "\t".join([p.strip() for p in parts[:6]] + ["\t".join(parts[6:]).strip()])
                      out_lines.append(cleaned_row + "\n")
                      kept += 1
              if kept > 0:
                  with open(dst_path, "w", encoding="utf-8", newline="\n") as fh:
                      fh.writelines(out_lines)
                  os.chmod(dst_path, 0o600)
                  return True
              return False

          if COOKIES_B64:
              try:
                  raw = base64.b64decode(COOKIES_B64, validate=True).decode("utf-8")
                  cookies_file = os.path.join(os.getcwd(), "yt_cookies.txt")
                  with open(cookies_file, "w", encoding="utf-8", newline="\n") as fh:
                      fh.write(raw if raw.endswith("\n") else raw + "\n")
                  os.chmod(cookies_file, 0o600)
                  clean_cookie_file = os.path.join(os.getcwd(), "yt_cookies_clean.txt")
                  if sanitize_cookie_file(cookies_file, clean_cookie_file, strip_rolling=False):
                      print("Validated and formatted YouTube cookies.")
                  else:
                      clean_cookie_file = cookies_file
                      print("Using raw YouTube cookies.")
              except Exception as exc:
                  print(f"::warning::Cookies decode warning: {exc}")
          else:
              print("No YouTube cookies supplied via INPUT_COOKIES.")

          if not URL:
              die("No video URL was supplied.")

          is_audio = FMT in ("mp3", "m4a", "opus", "wav")
          height = quality_height(QUALITY)
          final_ext = "mp3" if FMT == "mp3" else ("m4a" if is_audio else "mp4")

          video_id = "video"
          m = re.search(r"(?:v=|youtu\.be/|shorts/|embed/)([A-Za-z0-9_-]{11})", URL)
          if m:
              video_id = m.group(1)

          # Early title probe so we always have the real title even before downloading
          initial_title = ""
          try:
              probe_cmd_init = [
                  sys.executable, "-m", "yt_dlp", "--no-playlist", "--no-warnings",
                  "--skip-download", "--print", "%(title)s", URL]
              if clean_cookie_file and os.path.exists(clean_cookie_file):
                  probe_cmd_init += ["--cookies", clean_cookie_file]
              probe_init = subprocess.run(
                  probe_cmd_init,
                  capture_output=True, text=True, encoding="utf-8", errors="replace", timeout=60)
              if probe_init.returncode == 0 and probe_init.stdout.strip():
                  initial_title = probe_init.stdout.strip().splitlines()[0]
                  print(f"Title   : {initial_title}")
          except Exception:
              pass

          print(f"Fetching: {URL}")
          print(f"Format  : {'audio (' + final_ext + ')' if is_audio else 'video up to ' + str(height) + 'p'}")

          if is_audio:
              if FMT == "mp3":
                  selector = "bestaudio/best"
                  postprocess = ["--extract-audio", "--audio-format", "mp3"]
              else:
                  selector = f"bestaudio[ext={FMT}]/bestaudio/best"
                  postprocess = []
          else:
              selector = (
                  f"bestvideo[height<={height}]+bestaudio/"
                  f"best[height<={height}]/"
                  f"bestvideo+bestaudio/"
                  f"best"
              )
              postprocess = ["--merge-output-format", "mp4"]

          def run_ytdlp(client_list=None, cookie_path=None):
              c = [
                  sys.executable, "-m", "yt_dlp",
                  "--no-playlist",
                  "--newline",
                  "--retries", "5",
                  "--fragment-retries", "5",
                  "--socket-timeout", "30",
                  "--extractor-args", "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416",
              ]
              if client_list:
                  c += ["--extractor-args", f"youtube:player_client={client_list}"]
              c += [
                  "-f", selector,
                  "-o", "download.%(ext)s",
              ]
              deno_bin = shutil.which("deno") or os.path.expanduser("~/.deno/bin/deno")
              if isinstance(deno_bin, str) and os.path.exists(deno_bin):
                  c += ["--js-runtimes", f"deno:{deno_bin}"]
              else:
                  c += ["--js-runtimes", "deno"]
              c += ["--js-runtimes", "node", "--remote-components", "ejs:github"]
              if cookie_path and os.path.exists(cookie_path):
                  c += ["--cookies", cookie_path]
              if postprocess:
                  c += postprocess
              c.append(URL)
              res = subprocess.run(c, capture_output=True, text=True, encoding="utf-8", errors="replace")
              if res.returncode != 0 and not has_downloaded():
                  err_tail = "\n".join((res.stderr or "").splitlines()[-10:])
                  out_tail = "\n".join((res.stdout or "").splitlines()[-10:])
                  print(f"::warning::Client [{client_list or 'default'}] (cookies={bool(cookie_path)}) failed (exit {res.returncode}):\n{err_tail}\n{out_tail}")
              return res

          def is_download_file(name):
              # Only real finished outputs: exclude .part temp files and
              # .fN fragment leftovers that yt-dlp keeps mid-run.
              return (
                  name.startswith("download.")
                  and os.path.isfile(name)
                  and os.path.getsize(name) > 0
                  and not name.endswith(".part")
                  and ".part-" not in name
                  and not re.match(r"download\.f\d+", name)
              )

          def has_downloaded():
              return any(is_download_file(f) for f in os.listdir("."))

          def probe_height(file_path):
              """Real coded height of the first video stream, 0 when unknown."""
              try:
                  pr = subprocess.run(
                      ["ffprobe", "-v", "error", "-select_streams", "v:0",
                       "-show_entries", "stream=height",
                       "-of", "default=noprint_wrappers=1:nokey=1", file_path],
                      capture_output=True, text=True, timeout=60)
                  if pr.returncode == 0 and pr.stdout.strip():
                      return int(float(pr.stdout.strip().splitlines()[0]))
              except Exception:
                  pass
              return 0

          strategies = []
          if clean_cookie_file and os.path.exists(clean_cookie_file):
              strategies.append(("cookies: web_safari", "web_safari", clean_cookie_file))
              strategies.append(("cookies: default", None, clean_cookie_file))
              strategies.append(("cookies: web,web_creator", "web,web_creator", clean_cookie_file))
              stripped_cookie_file = os.path.join(os.getcwd(), "yt_cookies_stripped.txt")
              if sanitize_cookie_file(cookies_file, stripped_cookie_file, strip_rolling=True):
                  strategies.append(("stripped cookies: web_safari", "web_safari", stripped_cookie_file))
                  strategies.append(("stripped cookies: default", None, stripped_cookie_file))
              strategies.append(("cookies: web_embedded,mweb", "web_embedded,mweb", clean_cookie_file))
          strategies.append(("anonymous: default", None, None))
          strategies.append(("anonymous: web,web_creator", "web,web_creator", None))
          strategies.append(("anonymous: ios,web", "ios,web", None))
          strategies.append(("anonymous: web_embedded,mweb", "web_embedded,mweb", None))

          accepted_path = None
          accepted_client = None
          actual_height = 0
          fallbacks = []
          last_proc = None

          # Run every strategy until one delivers the REQUESTED quality. A client
          # that succeeds but only yields a low-res stream (e.g. YouTube's
          # always-available 360p progressive fallback) is parked as a fallback
          # and the chain continues with better clients.
          for idx, (label, client_list, cookie_path) in enumerate(strategies):
              print(f"\n=== Strategy {idx + 1}/{len(strategies)}: {label} ===")
              last_proc = run_ytdlp(client_list, cookie_path=cookie_path)
              files = [f for f in os.listdir(".") if is_download_file(f)]
              if not files:
                  continue
              candidate = os.path.join(".", max(files, key=lambda f: os.path.getsize(f)))
              if is_audio:
                  accepted_path, accepted_client = candidate, client_list
                  break
              seen_height = probe_height(candidate)
              if seen_height >= height:
                  accepted_path, accepted_client, actual_height = candidate, client_list, seen_height
                  print(f"Quality OK: real {seen_height}p >= requested {height}p. Stopping strategy chain.")
                  break
              print(f"::warning::Client [{client_list or 'default'}] delivered only {seen_height or 'unknown'}p, requested {height}p. Trying next strategy...")
              parked = os.path.join(".", f"fallback_{len(fallbacks) + 1}{os.path.splitext(candidate)[1]}")
              shutil.move(candidate, parked)
              fallbacks.append((parked, seen_height, client_list))

          if accepted_path is None and fallbacks:
              # Nothing met the requested quality: ship the best real result,
              # named with its TRUE resolution, never a fake label.
              fallbacks.sort(key=lambda t: (t[1], os.path.getsize(t[0])), reverse=True)
              accepted_path, actual_height, accepted_client = fallbacks[0]
              which = f" (client: {accepted_client})" if accepted_client else ""
              print(f"::warning::Requested {height}p but only {actual_height or 'unknown'}p{which} could be downloaded. The file is named with its real resolution.")
              print(f"::notice::Tip: add YouTube cookies in OctoFetch Settings to unlock higher resolutions, or the video itself may not offer {height}p.")

          if accepted_path is None:
              err = (last_proc.stderr or "").strip() if last_proc else "No output from downloader"
              tail = "\n".join(err.splitlines()[-14:])
              if "Sign in to confirm you" in err or "confirm you are not a bot" in err:
                  die("YouTube asked to confirm you are not a bot (HTTP 403).", tail)
              if "Private video" in err:
                  die("This video is private.", tail)
              if "members-only" in err.lower() or "join this channel" in err.lower():
                  die("This video is members-only. Supply valid YouTube cookies in Settings.", tail)
              if "age-restricted" in err.lower() or "confirm your age" in err.lower():
                  die("This video is age-restricted. Supply valid YouTube cookies in Settings.", tail)
              if "403" in err:
                  die("YouTube refused to serve the video stream (HTTP 403).", tail)
              die("Downloader could not fetch this video.", tail)

          path = accepted_path
          size_mb = os.path.getsize(path) / 1048576

          if size_mb < 0.01:
              die(f"The downloaded file is empty ({path}).")

          if CHUNK_LIMIT_MB and size_mb > CHUNK_LIMIT_MB:
              die(
                  f"The video is {size_mb:.0f} MB, over the {CHUNK_LIMIT_MB} MB limit this "
                  f"server allows. Choose a lower quality."
              )

          title = initial_title
          if not title:
              title_client = accepted_client or "web_safari"
              try:
                  probe_cmd = [
                      sys.executable, "-m", "yt_dlp", "--no-playlist", "--no-warnings",
                      "--js-runtimes", "deno", "--js-runtimes", "node", "--remote-components", "ejs:github",
                      "--extractor-args", "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416",
                  ]
                  if accepted_client:
                      probe_cmd += ["--extractor-args", f"youtube:player_client={title_client}"]
                  if clean_cookie_file and os.path.exists(clean_cookie_file):
                      probe_cmd += ["--cookies", clean_cookie_file]
                  probe_cmd += ["--skip-download", "--print", "%(title)s", URL]
                  probe = subprocess.run(
                      probe_cmd,
                      capture_output=True, text=True, encoding="utf-8", errors="replace", timeout=60)
                  if probe.returncode == 0 and probe.stdout.strip():
                      title = probe.stdout.strip().splitlines()[0]
              except Exception:
                  pass

          base_name = os.path.splitext(os.path.basename(path))[0]
          if not title or title.startswith("fallback_") or title.startswith("download"):
              if base_name and not base_name.startswith("fallback_") and not base_name.startswith("download"):
                  title = base_name
              else:
                  title = f"video_{video_id}"

          if is_audio:
              suffix = final_ext
          else:
              # Label with the REAL resolution of the file, never the requested one.
              real_height = probe_height(path) or actual_height
              suffix = f"{real_height}p" if real_height else f"{height}p"
          clean = re.sub(r"[^\w\-_()\[\]]", "_", title.replace(" ", "_"), flags=re.UNICODE)
          clean = re.sub(r"_+", "_", clean).strip("_")[:70] or video_id
          clean = clean.lstrip("-")
          filename = f"{clean}_{video_id}_{suffix}.{final_ext}"

          if os.path.exists(filename):
              os.remove(filename)
          os.rename(path, filename)
          final = os.path.abspath(filename)

          print(f"Downloaded: {filename} ({size_mb:.1f} MB)")

          with open(".download_info", "w", encoding="utf-8") as fh:
              fh.write(f"{final}\n{filename}\n{title}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"filename={filename}\n")
              fh.write(f"title={title}\n")

          for tmp_c in [cookies_file, clean_cookie_file, os.path.join(os.getcwd(), "yt_cookies_stripped.txt")]:
              if tmp_c and os.path.exists(tmp_c):
                  try:
                      os.remove(tmp_c)
                  except OSError:
                      pass
          print("Cleaned up temporary cookie files.")
          EOF

      - name: Stage the file
        run: |
          set -euo pipefail
          # .download_info holds: absolute path, file name, title.
          FILE_PATH=$(head -1 .download_info)
          FILENAME=$(sed -n '2p' .download_info)
          if [ ! -s "$FILE_PATH" ]; then
            echo "::error::Downloaded file is missing or empty: $FILE_PATH"
            exit 1
          fi
          mkdir -p source_file
          mv "$FILE_PATH" "source_file/$FILENAME"
          echo "FINAL_FILE=$FILENAME" >> "$GITHUB_ENV"

      - name: Compute folder identifier
        env:
          FOLDER_INPUT: ${{ github.event.inputs.folder_name }}
        run: |
          set -euo pipefail
          FOLDER=$(printf '%s' "$FOLDER_INPUT" | tr -c 'A-Za-z0-9._-' '_')
          [ ${#FOLDER} -gt 100 ] && FOLDER="${FOLDER:0:100}"
          [ -z "$FOLDER" ] && FOLDER="YT_$(date +%Y%m%d%H%M%S)"
          echo "FOLDER=$FOLDER" >> "$GITHUB_ENV"

      - name: Split large files
        env:
          THRESHOLD: ${{ github.event.inputs.chunk_threshold_bytes }}
        run: |
          set -euo pipefail
          SRC="source_file/$FINAL_FILE"
          SIZE=$(stat -c '%s' "$SRC")
          echo "FILE_SIZE=$SIZE"

          MAX_PART=2040109465
          if [ -z "${THRESHOLD:-}" ] || [ "$THRESHOLD" -le 0 ]; then
            THRESHOLD=$MAX_PART
          fi
          if [ "$THRESHOLD" -gt "$MAX_PART" ]; then
            THRESHOLD=$MAX_PART
          fi
          echo "THRESHOLD=$THRESHOLD"

          mkdir -p upload_parts
          if [ "$SIZE" -le "$THRESHOLD" ]; then
            cp "$SRC" "upload_parts/$FINAL_FILE"
            echo "PART_COUNT=1" >> "$GITHUB_ENV"
            echo "IS_SPLIT=false" >> "$GITHUB_ENV"
          else
            PARTS=$(( (SIZE + THRESHOLD - 1) / THRESHOLD ))
            PART_BYTES=$(( (SIZE + PARTS - 1) / PARTS ))
            echo "Splitting $FINAL_FILE ($SIZE bytes) into $PARTS parts of $PART_BYTES bytes each."
            split -d -a 2 -b "$PART_BYTES" "$SRC" "upload_parts/${FINAL_FILE}.part"
            echo "PART_COUNT=$PARTS" >> "$GITHUB_ENV"
            echo "IS_SPLIT=true" >> "$GITHUB_ENV"
          fi
          ls -lh upload_parts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.release_tag }}
          TITLE: ${{ github.event.inputs.release_title }}
        run: |
          set -euo pipefail
          [ -n "${TAG:-}" ] || { echo "::error::release_tag is empty"; exit 1; }
          DISPLAY_TITLE="${TITLE:-$TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — reusing."
          else
            echo "Creating release $TAG ($DISPLAY_TITLE)..."
            gh release create "$TAG" \
              --title "$DISPLAY_TITLE" \
              --notes "Uploaded by OctoFetch (folder: $FOLDER)" \
              --target "${GITHUB_REF_NAME:-main}"
          fi

      - name: Upload assets and build manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ASSETS=( upload_parts/* )
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::No assets produced — split stage left upload_parts/ empty."
            exit 1
          fi

          for a in "${ASSETS[@]}"; do
            echo "Uploading: $(basename "$a")"
            gh release upload "$TAG" "$a" --clobber
          done

          mkdir -p ".octofetch/releases/$FOLDER"
          gh api "repos/$GH_REPO/releases/tags/$TAG" \
            -H 'Accept: application/vnd.github+json' > release.json

          jq --arg folder "$FOLDER" \
             --arg tag    "$TAG" \
             --arg base   "$FINAL_FILE" \
             --arg split  "$IS_SPLIT" \
             --argjson parts "${PART_COUNT:-1}" \
             '{
                destination: "release",
                tag: $tag,
                folder: $folder,
                base_name: $base,
                is_split: ($split == "true"),
                part_count: $parts,
                release_url: .html_url,
                files: [
                  .assets[] | {
                    name: .name,
                    url: .browser_download_url,
                    api_url: .url,
                    id: .id,
                    size: .size,
                    download_count: .download_count
                  }
                ]
              }' release.json > ".octofetch/releases/$FOLDER/links.json"

      - name: Commit links manifest
        env:
          # TAG isn't carried forward via GITHUB_ENV — re-inject it here so
          # `set -u` doesn't bail on the commit message expansion.
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail

          git config user.name "OctoFetchBot"
          git config user.email "bot@octofetch.local"
          git config advice.updateSparsePath false

          git add --sparse -- ".octofetch/releases/$FOLDER/links.json"
          if git diff --cached --quiet; then
            echo "No links.json staged."
            exit 0
          fi
          git commit -m "Release: $FOLDER ($TAG) links manifest"

          for attempt in 1 2 3 4 5; do
            git fetch origin >/dev/null 2>&1 || true
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" >/dev/null 2>&1 || true
            if git push; then
              echo "Manifest pushed on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push links.json after 5 attempts"
          exit 1

      - name: Cleanup
        if: always()
        run: rm -rf source_file upload_parts 2>/dev/null || true
