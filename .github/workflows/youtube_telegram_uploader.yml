# OctoFetch-YouTubeTelegram-Version: 5

name: 'YouTube → Telegram Engine'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL'
        required: true
        type: string
      folder_name:
        description: 'Folder identifier used for the links manifest path'
        required: true
        type: string
      output_format:
        description: 'mp4 or mp3'
        required: false
        type: string
        default: 'mp4'
      desired_quality:
        description: 'Video quality (720p, 1080p) or audio bitrate (128kbps, 192kbps, 320kbps)'
        required: false
        type: string
        default: '1080p'
      cookies:
        description: 'Optional YouTube cookies in Netscape format, base64-encoded.'
        required: false
        type: string
        default: ''
      max_mb:
        description: 'Refuse videos larger than this many MB. 0 means no limit.'
        required: false
        type: string
        default: '0'
      telegram_target:
        description: 'Destination channel/group ID or username (e.g. @mychannel or -1001234567890)'
        required: true
        type: string
      telegram_worker_type:
        description: 'bot or account'
        required: false
        type: string
        default: 'bot'
      telegram_bot_token:
        description: 'Bot token (if worker_type is bot)'
        required: false
        type: string
        default: ''
      telegram_session:
        description: 'Base64-encoded user session (if worker_type is account)'
        required: false
        type: string
        default: ''
      telegram_api_id:
        description: 'Telegram API ID'
        required: false
        type: string
        default: '16612056'
      telegram_api_hash:
        description: 'Telegram API Hash'
        required: false
        type: string
        default: 'ae32caf162207865ff93b9b931b2ba54'
      telegram_caption:
        description: 'Custom message caption template'
        required: false
        type: string
        default: ''
      telegram_split_limit_mb:
        description: 'Maximum file size in MB before splitting (e.g. 2000 for bots/standard, 4000 for premium)'
        required: false
        type: string
        default: '2000'

permissions:
  contents: write

concurrency:
  group: yt-tg-${{ github.event.inputs.folder_name }}
  cancel-in-progress: false

jobs:
  youtube-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:

      - name: Checkout (sparse, fast)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            .octofetch
          sparse-checkout-cone-mode: false

      - name: Start PO-Token Provider (Docker)
        run: |
          docker run --name bgutil-provider -d --restart always -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
          for i in {1..30}; do
            if curl -s http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              echo "PO-Token Provider is ready."
              break
            fi
            echo "Waiting for PO-Token Provider..."
            sleep 1
          done

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zip curl python3 python3-pip ffmpeg
          pip3 install --quiet -U "yt-dlp[default]" yt-dlp-ejs bgutil-ytdlp-pot-provider telethon cryptg FastTelethonhelper

      - name: Install Deno Runtime
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 2 https://deno.land/install.sh | sh; then
              echo "$HOME/.deno/bin" >> $GITHUB_PATH
              echo "Deno installed successfully."
              exit 0
            fi
            echo "Deno install attempt $i failed, retrying in 3s..."
            sleep 3
          done
          echo "::warning::Deno install failed after retries; yt-dlp will fall back to Node/EJS runtime."

      - name: Download YouTube Media
        env:
          INPUT_URL: ${{ github.event.inputs.video_url }}
          INPUT_FOLDER: ${{ github.event.inputs.folder_name }}
          INPUT_FORMAT: ${{ github.event.inputs.output_format }}
          INPUT_QUALITY: ${{ github.event.inputs.desired_quality }}
          INPUT_COOKIES: ${{ github.event.inputs.cookies }}
          INPUT_MAX_MB: ${{ github.event.inputs.max_mb }}
        run: |
          set -e
          export PATH="$HOME/.deno/bin:$PATH"

          mkdir -p output_media

          python3 - <<'PYEOF'
          import base64
          import glob
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import time

          URL = os.environ.get("INPUT_URL", "").strip()
          FMT = os.environ.get("INPUT_FORMAT", "mp4").strip().lower()
          QUALITY = os.environ.get("INPUT_QUALITY", "1080p").strip().lower()
          COOKIES_B64 = os.environ.get("INPUT_COOKIES", "").strip()
          CHUNK_LIMIT_MB = int(os.environ.get("INPUT_MAX_MB", "0") or 0)

          cookies_file = None
          clean_cookie_file = None
          stripped_cookie_file = None

          def die(message, detail=""):
              for cf in (cookies_file, clean_cookie_file, stripped_cookie_file):
                  if cf and os.path.exists(cf):
                      try:
                          os.remove(cf)
                      except OSError:
                          pass
              print("Cleaned up temporary cookie files.")
              if detail:
                  print(f"::error::{message}")
                  print(detail)
              else:
                  print(f"::error::{message}")
              sys.exit(1)

          def quality_height(raw):
              m = re.search(r"(\d{3,4})", raw or "")
              if not m:
                  return 1080
              value = int(m.group(1))
              for floor in (2160, 1440, 1080, 720, 480, 360, 240, 144):
                  if value >= floor:
                      return floor
              return 144

          def sanitize_cookie_file(src_path, dst_path, strip_rolling=False):
              if not src_path or not os.path.exists(src_path):
                  return False
              with open(src_path, "r", encoding="utf-8", errors="replace") as fh:
                  lines = fh.readlines()
              out_lines = [
                  "# Netscape HTTP Cookie File\n",
                  "# https://curl.haxx.se/rfc/cookie_spec.html\n",
                  "# This is a generated file! Do not edit.\n\n"
              ]
              kept = 0
              for line in lines:
                  s = line.strip()
                  if not s or s.startswith("# Netscape") or s.startswith("# http") or s.startswith("# This is"):
                      continue
                  if s.startswith("#") and not s.startswith("#HttpOnly_"):
                      continue
                  parts = s.split("\t")
                  if len(parts) < 7:
                      parts = re.split(r"\s+", s)
                  if len(parts) >= 7:
                      cname = parts[5].strip()
                      if strip_rolling and any(k in cname for k in ("PSIDTS", "SIDCC")):
                          continue
                      cleaned_row = "\t".join([p.strip() for p in parts[:6]] + ["\t".join(parts[6:]).strip()])
                      out_lines.append(cleaned_row + "\n")
                      kept += 1
              if kept > 0:
                  with open(dst_path, "w", encoding="utf-8", newline="\n") as fh:
                      fh.writelines(out_lines)
                  os.chmod(dst_path, 0o600)
                  return True
              return False

          if COOKIES_B64:
              try:
                  raw = base64.b64decode(COOKIES_B64, validate=True).decode("utf-8")
                  cookies_file = os.path.join(os.getcwd(), "yt_cookies.txt")
                  with open(cookies_file, "w", encoding="utf-8", newline="\n") as fh:
                      fh.write(raw if raw.endswith("\n") else raw + "\n")
                  os.chmod(cookies_file, 0o600)
                  clean_cookie_file = os.path.join(os.getcwd(), "yt_cookies_clean.txt")
                  if sanitize_cookie_file(cookies_file, clean_cookie_file, strip_rolling=False):
                      print("Validated and formatted YouTube cookies.")
                  else:
                      clean_cookie_file = cookies_file
                      print("Using raw YouTube cookies.")
              except Exception as exc:
                  print(f"::warning::Cookies decode warning: {exc}")
          else:
              print("No YouTube cookies supplied via INPUT_COOKIES.")

          if not URL:
              die("No video URL was supplied.")

          is_audio = FMT in ("mp3", "m4a", "opus", "wav")
          height = quality_height(QUALITY)
          final_ext = "mp3" if FMT == "mp3" else ("m4a" if is_audio else "mp4")

          video_id = "video"
          m = re.search(r"(?:v=|youtu\.be/|shorts/|embed/)([A-Za-z0-9_-]{11})", URL)
          if m:
              video_id = m.group(1)

          initial_title = ""
          try:
              probe_cmd_init = [
                  sys.executable, "-m", "yt_dlp", "--no-playlist", "--no-warnings",
                  "--skip-download", "--print", "%(title)s", URL]
              if clean_cookie_file and os.path.exists(clean_cookie_file):
                  probe_cmd_init += ["--cookies", clean_cookie_file]
              probe_init = subprocess.run(
                  probe_cmd_init,
                  capture_output=True, text=True, encoding="utf-8", errors="replace", timeout=60)
              if probe_init.returncode == 0 and probe_init.stdout.strip():
                  initial_title = probe_init.stdout.strip().splitlines()[0]
                  print(f"Title   : {initial_title}")
          except Exception:
              pass

          print(f"Fetching: {URL}")
          print(f"Format  : {'audio (' + final_ext + ')' if is_audio else 'video up to ' + str(height) + 'p'}")

          if is_audio:
              if FMT == "mp3":
                  selector = "bestaudio/best"
                  postprocess = ["--extract-audio", "--audio-format", "mp3"]
              else:
                  selector = f"bestaudio[ext={FMT}]/bestaudio/best"
                  postprocess = []
          else:
              selector = (
                  f"bestvideo[height<={height}]+bestaudio/"
                  f"best[height<={height}]/"
                  f"bestvideo+bestaudio/"
                  f"best"
              )
              postprocess = ["--merge-output-format", "mp4"]

          def run_ytdlp(client_list=None, cookie_path=None):
              c = [
                  sys.executable, "-m", "yt_dlp",
                  "--no-playlist",
                  "--newline",
                  "--retries", "5",
                  "--fragment-retries", "5",
                  "--socket-timeout", "30",
                  "--extractor-args", "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416",
              ]
              if client_list:
                  c += ["--extractor-args", f"youtube:player_client={client_list}"]
              c += [
                  "-f", selector,
                  "-o", "download.%(ext)s",
              ]
              deno_bin = shutil.which("deno") or os.path.expanduser("~/.deno/bin/deno")
              if isinstance(deno_bin, str) and os.path.exists(deno_bin):
                  c += ["--js-runtimes", f"deno:{deno_bin}"]
              c += ["--js-runtimes", "node", "--remote-components", "ejs:github"]
              if cookie_path and os.path.exists(cookie_path):
                  c += ["--cookies", cookie_path]
              if postprocess:
                  c += postprocess
              c.append(URL)
              res = subprocess.run(c, capture_output=True, text=True, encoding="utf-8", errors="replace")
              if res.returncode != 0 and not has_downloaded():
                  err_tail = "\n".join((res.stderr or "").splitlines()[-10:])
                  out_tail = "\n".join((res.stdout or "").splitlines()[-10:])
                  print(f"::warning::Client [{client_list or 'default'}] (cookies={bool(cookie_path)}) failed (exit {res.returncode}):\n{err_tail}\n{out_tail}")
              return res

          def is_download_file(name):
              return (
                  name.startswith("download.")
                  and os.path.isfile(name)
                  and os.path.getsize(name) > 0
                  and not name.endswith(".part")
                  and ".part-" not in name
                  and not re.match(r"download\.f\d+", name)
              )

          def has_downloaded():
              return any(is_download_file(f) for f in os.listdir("."))

          def probe_height(file_path):
              try:
                  pr = subprocess.run(
                      ["ffprobe", "-v", "error", "-select_streams", "v:0",
                       "-show_entries", "stream=height",
                       "-of", "default=noprint_wrappers=1:nokey=1", file_path],
                      capture_output=True, text=True, timeout=60)
                  if pr.returncode == 0 and pr.stdout.strip():
                      return int(float(pr.stdout.strip().splitlines()[0]))
              except Exception:
                  pass
              return 0

          strategies = []
          if clean_cookie_file and os.path.exists(clean_cookie_file):
              strategies.append(("cookies: web_safari", "web_safari", clean_cookie_file))
              strategies.append(("cookies: default", None, clean_cookie_file))
              strategies.append(("cookies: web,web_creator", "web,web_creator", clean_cookie_file))
              stripped_cookie_file = os.path.join(os.getcwd(), "yt_cookies_stripped.txt")
              if sanitize_cookie_file(cookies_file, stripped_cookie_file, strip_rolling=True):
                  strategies.append(("stripped cookies: web_safari", "web_safari", stripped_cookie_file))
                  strategies.append(("stripped cookies: default", None, stripped_cookie_file))
              strategies.append(("cookies: web_embedded,mweb", "web_embedded,mweb", clean_cookie_file))
          strategies.append(("anonymous: default", None, None))
          strategies.append(("anonymous: web,web_creator", "web,web_creator", None))
          strategies.append(("anonymous: ios,web", "ios,web", None))
          strategies.append(("anonymous: web_embedded,mweb", "web_embedded,mweb", None))

          accepted_path = None
          accepted_client = None
          actual_height = 0
          fallbacks = []
          last_proc = None

          for idx, (label, client_list, cookie_path) in enumerate(strategies):
              print(f"\n=== Strategy {idx + 1}/{len(strategies)}: {label} ===")
              last_proc = run_ytdlp(client_list, cookie_path=cookie_path)
              files = [f for f in os.listdir(".") if is_download_file(f)]
              if not files:
                  continue
              candidate = os.path.join(".", max(files, key=lambda f: os.path.getsize(f)))
              if is_audio:
                  accepted_path, accepted_client = candidate, client_list
                  break
              seen_height = probe_height(candidate)
              if seen_height >= height:
                  accepted_path, accepted_client, actual_height = candidate, client_list, seen_height
                  print(f"Quality OK: real {seen_height}p >= requested {height}p. Stopping strategy chain.")
                  break
              print(f"::warning::Client [{client_list or 'default'}] delivered only {seen_height or 'unknown'}p, requested {height}p. Trying next strategy...")
              parked = os.path.join(".", f"fallback_{len(fallbacks) + 1}{os.path.splitext(candidate)[1]}")
              shutil.move(candidate, parked)
              fallbacks.append((parked, seen_height, client_list))

          if accepted_path is None and fallbacks:
              fallbacks.sort(key=lambda t: (t[1], os.path.getsize(t[0])), reverse=True)
              accepted_path, actual_height, accepted_client = fallbacks[0]
              which = f" (client: {accepted_client})" if accepted_client else ""
              print(f"::warning::Requested {height}p but only {actual_height or 'unknown'}p{which} could be downloaded. The file is named with its real resolution.")
              print(f"::notice::Tip: add YouTube cookies in OctoFetch Settings to unlock higher resolutions, or the video itself may not offer {height}p.")

          if accepted_path is None:
              err = (last_proc.stderr or "").strip() if last_proc else "No output from downloader"
              tail = "\n".join(err.splitlines()[-14:])
              if "Sign in to confirm you" in err or "confirm you are not a bot" in err:
                  die("YouTube asked to confirm you are not a bot (HTTP 403).", tail)
              if "Private video" in err:
                  die("This video is private.", tail)
              if "members-only" in err.lower() or "join this channel" in err.lower():
                  die("This video is members-only. Supply valid YouTube cookies in Settings.", tail)
              if "age-restricted" in err.lower() or "confirm your age" in err.lower():
                  die("This video is age-restricted. Supply valid YouTube cookies in Settings.", tail)
              if "403" in err:
                  die("YouTube refused to serve the video stream (HTTP 403).", tail)
              die("Downloader could not fetch this video.", tail)

          path = accepted_path
          size_mb = os.path.getsize(path) / 1048576

          if size_mb < 0.01:
              die(f"The downloaded file is empty ({path}).")

          if CHUNK_LIMIT_MB and size_mb > CHUNK_LIMIT_MB:
              die(
                  f"The video is {size_mb:.0f} MB, over the {CHUNK_LIMIT_MB} MB limit this "
                  f"server allows. Choose a lower quality."
              )

          title = initial_title
          if not title:
              title_client = accepted_client or "web_safari"
              try:
                  probe_cmd = [
                      sys.executable, "-m", "yt_dlp", "--no-playlist", "--no-warnings",
                      "--js-runtimes", "node", "--remote-components", "ejs:github",
                      "--extractor-args", "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416",
                  ]
                  if isinstance(deno_bin, str) and os.path.exists(deno_bin):
                      probe_cmd += ["--js-runtimes", f"deno:{deno_bin}"]
                  if accepted_client:
                      probe_cmd += ["--extractor-args", f"youtube:player_client={title_client}"]
                  if clean_cookie_file and os.path.exists(clean_cookie_file):
                      probe_cmd += ["--cookies", clean_cookie_file]
                  probe_cmd += ["--skip-download", "--print", "%(title)s", URL]
                  probe = subprocess.run(
                      probe_cmd,
                      capture_output=True, text=True, encoding="utf-8", errors="replace", timeout=60)
                  if probe.returncode == 0 and probe.stdout.strip():
                      title = probe.stdout.strip().splitlines()[0]
              except Exception:
                  pass

          base_name = os.path.splitext(os.path.basename(path))[0]
          if not title or title.startswith("fallback_") or title.startswith("download"):
              if base_name and not base_name.startswith("fallback_") and not base_name.startswith("download"):
                  title = base_name
              else:
                  title = f"video_{video_id}"

          if is_audio:
              suffix = final_ext
          else:
              real_height = probe_height(path) or actual_height
              suffix = f"{real_height}p" if real_height else f"{height}p"

          clean = re.sub(r"[^\w\-_()\[\]]", "_", title.replace(" ", "_"), flags=re.UNICODE)
          clean = re.sub(r"_+", "_", clean).strip("_")[:70] or video_id
          clean = clean.lstrip("-")
          filename = f"{clean}_{video_id}_{suffix}.{final_ext}"

          target_dir = os.path.abspath("output_media")
          os.makedirs(target_dir, exist_ok=True)
          dest_path = os.path.join(target_dir, filename)

          if os.path.exists(dest_path):
              os.remove(dest_path)
          shutil.move(path, dest_path)

          print(f"Downloaded and placed in output_media: {filename} ({size_mb:.1f} MB)")

          for f in os.listdir("."):
              if f.startswith("fallback_") and os.path.isfile(f):
                  try:
                      os.remove(f)
                  except OSError:
                      pass

          for tmp_c in [cookies_file, clean_cookie_file, os.path.join(os.getcwd(), "yt_cookies_stripped.txt")]:
              if tmp_c and os.path.exists(tmp_c):
                  try:
                      os.remove(tmp_c)
                  except OSError:
                      pass
          print("Cleaned up temporary cookie and fallback files.")
          PYEOF

      - name: Upload Media to Telegram
        env:
          FOLDER: ${{ github.event.inputs.folder_name }}
          TARGET: ${{ github.event.inputs.telegram_target }}
          WORKER_TYPE: ${{ github.event.inputs.telegram_worker_type }}
          BOT_TOKEN: ${{ github.event.inputs.telegram_bot_token }}
          SESSION_DATA: ${{ github.event.inputs.telegram_session }}
          API_ID: ${{ github.event.inputs.telegram_api_id }}
          API_HASH: ${{ github.event.inputs.telegram_api_hash }}
          CAPTION: ${{ github.event.inputs.telegram_caption }}
          SPLIT_LIMIT_MB: ${{ github.event.inputs.telegram_split_limit_mb }}
        run: |
          set -euo pipefail

          python3 -u - <<'PYEOF'
          import os, sys, glob, json, math, base64, asyncio

          try:
              import FastTelethonhelper
              has_fast = True
          except Exception:
              has_fast = False

          folder = os.environ.get("FOLDER")
          target_chat = os.environ.get("TARGET", "").strip()
          worker_type = os.environ.get("WORKER_TYPE", "bot").lower()
          bot_token = os.environ.get("BOT_TOKEN", "").strip()
          session_data = os.environ.get("SESSION_DATA", "").strip()
          api_id = int(os.environ.get("API_ID", "16612056"))
          api_hash = os.environ.get("API_HASH", "ae32caf162207865ff93b9b931b2ba54")
          caption_tmpl = os.environ.get("CAPTION", "").strip()
          split_limit_mb = int(os.environ.get("SPLIT_LIMIT_MB", "2000"))

          # Dynamic splitting threshold & part sizing:
          # - Free account / Bot: 2 GB ceiling -> split into 1.9 GB (1900 MB) parts if > 2 GB
          # - Premium account: 4 GB ceiling -> split into 3.9 GB (3900 MB) parts if > 4 GB
          if split_limit_mb >= 3000:
              threshold_bytes = 4000 * 1024 * 1024
              part_size_bytes = 3900 * 1024 * 1024
              policy_name = "Premium (Threshold: 4 GB, Part size: 3.9 GB)"
          else:
              threshold_bytes = 2000 * 1024 * 1024
              part_size_bytes = 1900 * 1024 * 1024
              policy_name = "Free Account / Bot (Threshold: 2 GB, Part size: 1.9 GB)"

          print(f"Telegram auto-split policy: {policy_name}", flush=True)

          files = sorted(glob.glob("output_media/*"))
          files = [f for f in files if os.path.isfile(f) and not f.endswith(".txt")]
          if not files:
              print("::error::No downloaded media found to upload", file=sys.stderr)
              sys.exit(1)

          files_to_upload = []
          for fpath in files:
              size = os.path.getsize(fpath)
              if size > threshold_bytes:
                  print(f"Media {fpath} ({size / (1024*1024):.1f} MB) exceeds {threshold_bytes // (1024*1024)} MB limit. Splitting into {part_size_bytes // (1024*1024)} MB parts...", flush=True)
                  base_name = os.path.basename(fpath)
                  part_num = 1
                  with open(fpath, "rb") as src:
                      while True:
                          chunk = src.read(part_size_bytes)
                          if not chunk:
                              break
                          part_path = f"output_media/{base_name}.part{part_num:03d}"
                          with open(part_path, "wb") as dst:
                              dst.write(chunk)
                          files_to_upload.append(part_path)
                          part_num += 1
                  os.remove(fpath)
              else:
                  files_to_upload.append(fpath)

          async def main():
              from telethon import TelegramClient
              from telethon.sessions import StringSession

              session_to_use = None
              if session_data:
                  try:
                      session_to_use = StringSession(session_data)
                  except Exception:
                      sess_bytes = base64.b64decode(session_data)
                      with open("temp_account.session", "wb") as sf:
                          sf.write(sess_bytes)
                      session_to_use = "temp_account"
              else:
                  session_to_use = StringSession()

              client = TelegramClient(session_to_use, api_id, api_hash)
              if worker_type == "bot" and bot_token:
                  await client.start(bot_token=bot_token)
              else:
                  await client.connect()
                  if not await client.is_user_authorized():
                      if bot_token:
                          await client.start(bot_token=bot_token)
                      else:
                          print("::error::Telegram client could not authorize session.", file=sys.stderr)
                          sys.exit(1)

              entity = None
              try:
                  if target_chat.startswith("-") or target_chat.isdigit():
                      entity = await client.get_entity(int(target_chat))
                  else:
                      clean_target = target_chat.lstrip("@").split("/")[-1]
                      entity = await client.get_entity(clean_target)
              except Exception as e:
                  print(f"::error::Could not resolve Telegram target '{target_chat}': {e}", file=sys.stderr)
                  sys.exit(1)

              results = []
              total_count = len(files_to_upload)

              for idx, fpath in enumerate(files_to_upload, start=1):
                  fname = os.path.basename(fpath)
                  fsize = os.path.getsize(fpath)
                  cap = caption_tmpl.replace("{name}", fname).replace("{file}", fname) if caption_tmpl else fname
                  if total_count > 1:
                      cap += f" [{idx}/{total_count}]"

                  last_reported_pct = [0]
                  def callback(uploaded, total):
                      if total > 0:
                          pct = int((uploaded / total) * 100)
                          if pct >= last_reported_pct[0] + 10 or pct == 100:
                              last_reported_pct[0] = pct
                              print(f"  > Progress: {pct}% ({uploaded // (1024*1024)}/{total // (1024*1024)} MB)", flush=True)

                  msg = None
                  if has_fast:
                      print(f"Uploading [{idx}/{total_count}] with multi-connection engine: {fname} ({fsize / (1024*1024):.1f} MB)...", flush=True)
                      try:
                          with open(fpath, "rb") as f:
                              uploaded_file = await FastTelethonhelper.upload_file(
                                  client=client,
                                  file=f,
                                  name=fname,
                                  progress_callback=callback
                              )
                          msg = await client.send_file(
                              entity,
                              uploaded_file,
                              caption=cap
                          )
                      except Exception as ex:
                          print(f"Fast upload fallback: {ex}, using standard send_file...", flush=True)
                          msg = await client.send_file(
                              entity,
                              fpath,
                              caption=cap,
                              progress_callback=callback
                          )
                  else:
                      print(f"Uploading [{idx}/{total_count}]: {fname} ({fsize / (1024*1024):.1f} MB)...", flush=True)
                      msg = await client.send_file(
                          entity,
                          fpath,
                          caption=cap,
                          progress_callback=callback
                      )

                  post_url = ""
                  try:
                      if hasattr(entity, "username") and entity.username:
                          post_url = f"https://t.me/{entity.username}/{msg.id}"
                      elif target_chat.startswith("-100"):
                          clean_id = target_chat[4:]
                          post_url = f"https://t.me/c/{clean_id}/{msg.id}"
                  except Exception:
                      pass

                  results.append({
                      "name": fname,
                      "size": fsize,
                      "message_id": msg.id,
                      "url": post_url or f"Telegram: message {msg.id}"
                  })
                  print(f"Uploaded: {fname} -> Message ID {msg.id}")

              await client.disconnect()

              out_dir = os.path.join(".octofetch", "telegram", folder)
              os.makedirs(out_dir, exist_ok=True)
              with open(os.path.join(out_dir, "links.json"), "w", encoding="utf-8") as f:
                  json.dump({"destination": "telegram", "target": target_chat, "files": results}, f, indent=2)

          asyncio.run(main())
          PYEOF

      - name: Commit links manifest
        env:
          FOLDER: ${{ github.event.inputs.folder_name }}
        run: |
          set -euo pipefail

          git config user.name "OctoFetchBot"
          git config user.email "bot@octofetch.local"
          git config advice.updateSparsePath false

          git add --sparse -- ".octofetch/telegram/$FOLDER/links.json"
          if git diff --cached --quiet; then
            echo "No links.json staged."
            exit 0
          fi
          git commit -m "Telegram: $FOLDER links manifest"

          for attempt in 1 2 3 4 5; do
            git fetch origin >/dev/null 2>&1 || true
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" >/dev/null 2>&1 || true
            if git push; then
              echo "Manifest pushed on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push links.json after 5 attempts"
          exit 1

      - name: Cleanup
        if: always()
        run: rm -rf output_media 2>/dev/null || true
